name = "keyvault"
main = "src/index.js"
compatibility_date = "2026-10-01"
routes = [
  { pattern = "key.usb.kr", custom_domain = true },
  { pattern = "key.usb.kr/*", zone_name = "usb.kr" },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[r2_buckets]]
binding = "VAULT"
bucket_name = "apikeys-vault"
