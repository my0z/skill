<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API 키 금고</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f4f4f5;--line:#d4d4d8;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--card:#1c1c1f;--line:#3f3f46;--ac:#60a5fa}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui}
main{max-width:860px;margin:0 auto;padding:16px}
input,button,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
textarea{resize:none;overflow:hidden;word-break:break-all;display:block;box-sizing:border-box}
[hidden]{display:none!important}
.m{-webkit-text-security:disc}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
#gate{display:flex;flex-direction:column;gap:8px;max-width:320px;margin:20vh auto}
#bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#q{flex:1;min-width:120px}
.row{display:flex;gap:6px;align-items:center;background:var(--card);padding:6px 8px;border-radius:8px;margin-bottom:6px}
.row.dupe{background:rgba(220,38,38,.18);box-shadow:inset 4px 0 #dc2626;font-weight:700}
.nm{flex:1;min-width:0;text-align:left;word-break:break-all;background:transparent;border-color:transparent}
#msg{color:#dc2626;min-height:1.2em}
.info{font-size:12px;opacity:.75}
.info.w{color:#dc2626;opacity:1}
#st{align-self:center;font-size:12px;opacity:.75}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:min(560px,calc(100vw - 32px));padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
#f,#if{display:grid;gap:8px}
dialog h3{margin:0}
#f input,#f textarea,#if input{width:100%;box-sizing:border-box}
#ir{max-height:50vh;overflow:auto;display:grid;gap:4px}
.sum{font-weight:600}
.ir-row{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:6px;background:var(--card);word-break:break-all}
.ir-row span:last-child{opacity:.75;white-space:nowrap}
.ir-row.same{background:rgba(220,38,38,.18);border-left:4px solid #dc2626;font-weight:700}
.ir-row.same span:last-child{opacity:1;color:#dc2626}
#dk{font-family:ui-monospace,monospace;font-size:13px}
.b{display:flex;flex-wrap:wrap;gap:6px}
#dx{margin-left:auto;color:#dc2626}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}</style>
<main>
  <form id="gate">
    <h2 id="gt">잠김</h2>
    <input id="pw" type="password" placeholder="마스터 암호" autocomplete="current-password" autofocus>
    <button class="p">열기</button>
    <div id="msg"></div>
  </form>
  <section id="app" hidden>
    <div id="bar">
      <input id="q" placeholder="검색">
      <button id="add" class="p">+ 추가</button>
      <button id="exp">내보내기</button>
      <button id="imp">가져오기</button>
      <button id="lock">잠금</button>
      <span id="st"></span>
      <input id="file" type="file" accept=".json" hidden>
    </div>
    <div id="list"></div>
  </section>
</main>
<dialog id="dlg">
  <form id="f">
    <h3 id="dt"></h3>
    <textarea id="dn" rows="1" placeholder="이름" required></textarea>
    <textarea id="dk" class="m" rows="1" placeholder="키" spellcheck="false"></textarea>
    <input id="dm" placeholder="메모">
    <small id="di" class="info"></small>
    <div class="b">
      <button class="p">저장</button>
      <button type="button" id="dc">취소</button>
      <button type="button" id="dx">삭제</button>
    </div>
  </form>
</dialog>
<dialog id="idg">
  <form id="if">
    <h3>가져오기</h3>
    <input id="ip" type="password" placeholder="가져올 파일의 마스터 암호" autocomplete="off">
    <div id="ir"></div>
    <div class="b">
      <button id="ig" class="p">확인</button>
      <button type="button" id="ic">취소</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
// shortcut: spread breaks past ~100KB of data; switch to chunked conversion if the vault grows that large
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let key, salt, items = [], ed = -1, t2;

const derive = async (pw, s) => crypto.subtle.deriveKey(
  {name: 'PBKDF2', salt: s, iterations: 310000, hash: 'SHA-256'},
  await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']),
  {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);

// 저장 후 저장소에서 다시 읽어 복호화해 원본과 비교한다
async function save() {
  const json = JSON.stringify(items);
  try {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, enc.encode(json));
    localStorage.vault = JSON.stringify({s: b64(salt), i: b64(iv), d: b64(ct)});
    const v = JSON.parse(localStorage.vault);
    const back = dec.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(v.i)}, key, unb64(v.d)));
    $('#st').textContent = back === json ? '저장됨 ✓ ' + new Date().toLocaleTimeString() : '저장 실패!';
  } catch { $('#st').textContent = '저장 실패!'; }
}
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 1200); };

const v0 = () => { try { return JSON.parse(localStorage.vault); } catch { return null; } };
if (!v0()) $('#gt').textContent = '새 금고: 암호 설정 (8자 이상)';

$('#gate').onsubmit = async e => {
  e.preventDefault();
  const pw = $('#pw').value, v = v0();
  $('#msg').textContent = '';
  if (!v) {
    if (pw.length < 8) return $('#msg').textContent = '8자 이상 필요';
    salt = crypto.getRandomValues(new Uint8Array(16));
    key = await derive(pw, salt);
    items = [];
    await save();
  } else {
    salt = unb64(v.s);
    key = await derive(pw, salt);
    try {
      items = JSON.parse(dec.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(v.i)}, key, unb64(v.d))));
    } catch { key = null; return $('#msg').textContent = '암호 틀림'; }
  }
  $('#pw').value = '';
  $('#gate').hidden = true;
  $('#app').hidden = false;
  render();
  idle();
};

// 목록에는 이름만 보인다. 이름을 누르면 이름 복사 키는 옆 버튼으로만 복사한다
function render() {
  const q = $('#q').value.toLowerCase(), list = $('#list');
  list.textContent = '';
  items.forEach((it, i) => {
    if (q && !(it.n + it.m).toLowerCase().includes(q)) return;
    const r = document.createElement('div');
    r.className = 'row';
    r.dataset.i = i;
    // 검색 중에는 보이는 항목 사이 순서가 모호해서 위아래 버튼을 숨긴다
    r.innerHTML = (q ? '' : '<button data-a="up" title="위로" aria-label="위로">▲</button><button data-a="dn" title="아래로" aria-label="아래로">▼</button>')
      + '<button class="nm" data-a="cpn"></button><button data-a="cpk">키복사</button><button data-a="ed">수정</button>';
    if (!q) {
      r.querySelector('[data-a=up]').disabled = i === 0;
      r.querySelector('[data-a=dn]').disabled = i === items.length - 1;
    }
    r.querySelector('.nm').textContent = it.n;
    r.querySelector('.nm').title = it.m;
    list.append(r);
  });
}

$('#list').onclick = async e => {
  const b = e.target.closest('button');
  if (!b) return;
  const i = +b.closest('.row').dataset.i, a = b.dataset.a;
  if (a === 'ed') return openDlg(i);
  if (a === 'up' || a === 'dn') {
    const j = a === 'up' ? i - 1 : i + 1;
    [items[i], items[j]] = [items[j], items[i]];
    render();
    $(`#list .row[data-i="${j}"] [data-a=${a}]`)?.focus();
    return save();
  }
  try {
    await navigator.clipboard.writeText(a === 'cpn' ? items[i].n : items[i].k);
    toast(a === 'cpn' ? '이름 복사됨' : '키 복사됨');
  } catch { toast('복사 실패'); }
};

// 키 칸은 textarea에 CSS로 가려 줄바꿈으로 끝까지 보이게 한다. 미지원 브라우저는 password input으로 대체한다
const TS = CSS.supports('-webkit-text-security', 'disc');
if (!TS) $('#dk').replaceWith(Object.assign(document.createElement('input'),
  {id: 'dk', type: 'password', autocomplete: 'off', spellcheck: false, placeholder: '키'}));
const dn = $('#dn'), dk = $('#dk'), dm = $('#dm');
const grow = el => { if (el.tagName === 'TEXTAREA') { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; } };
const mask = on => TS ? dk.classList.toggle('m', on) : (dk.type = on ? 'password' : 'text');
// 다른 항목과 이름이나 키가 같으면 이유를 돌려준다 (공백 차이는 무시하고 이름은 대소문자도 무시)
const match = (n, k, others) => ({
  byName: n.trim() && others.find(o => o.n.trim().toLowerCase() === n.trim().toLowerCase()),
  byKey: k.trim() && others.find(o => o.k.trim() === k.trim()),
});
const dupOf = () => {
  const {byName, byKey} = match(dn.value, dk.value, items.filter((_, i) => i !== ed));
  return {byName, msg: [byName && '같은 이름 있음', byKey && `같은 키 있음: ${byKey.n}`].filter(Boolean).join(' · ')};
};
// 같은 이름이 이미 있는 항목을 목록에서 강조하고 화면 안으로 가져온다
const flag = set => {
  document.querySelectorAll('#list .row').forEach(r => r.classList.toggle('dupe', set.has(items[r.dataset.i])));
  $('#list .dupe')?.scrollIntoView({block: 'center'});
};
function info() {
  const k = dk.value, ws = /\s/.test(k), d = dupOf(), s = $('#di');
  s.className = 'info' + (ws || d.msg ? ' w' : '');
  s.textContent = (k ? `${k.length}자 · 끝 ${k.slice(-4)}` : '키 비어 있음') + (ws ? ' · ⚠ 공백 포함' : '') + (d.msg ? ` · ⛔ ${d.msg}` : '');
  $('#f .p').disabled = !!d.msg;
  flag(new Set(d.byName ? [d.byName] : []));
}
function openDlg(i) {
  ed = i;
  const it = i < 0 ? {n: '', k: '', m: ''} : items[i];
  dn.value = it.n; dk.value = it.k; dm.value = it.m;
  $('#dt').textContent = i < 0 ? '키 추가' : '키 수정';
  $('#dx').hidden = i < 0;
  mask(true);
  $('#dlg').showModal();
  [dn, dk].forEach(grow);
  info();
}
// 키 칸은 입력 중에만 평문으로 보여 오타를 바로 확인한다
dk.onfocus = () => mask(false);
dk.onblur = () => mask(true);
$('#f').oninput = e => { if (e.target.tagName === 'TEXTAREA') grow(e.target); info(); };
$('#f').onkeydown = e => { if (e.key === 'Enter' && e.target.tagName === 'TEXTAREA') { e.preventDefault(); $('#f').requestSubmit(); } };
$('#f').onsubmit = async e => {
  e.preventDefault();
  if (dupOf().msg) return dk.focus();
  const it = {n: dn.value.trim(), k: dk.value, m: dm.value};
  if (!it.n) return dn.focus();
  if (ed < 0) items.unshift(it); else items[ed] = it;
  $('#dlg').close();
  render();
  await save();
};
$('#dc').onclick = () => $('#dlg').close();
$('#dx').onclick = async () => {
  if (!confirm('삭제할까요?')) return;
  items.splice(ed, 1);
  $('#dlg').close();
  render();
  await save();
};
// 닫을 때 입력값을 지워 키가 화면 밖 DOM에 남지 않게 한다
$('#dlg').onclose = () => { dn.value = dk.value = dm.value = ''; flag(new Set()); };
addEventListener('resize', () => [dn, dk].forEach(grow));

$('#add').onclick = () => openDlg(-1);
$('#q').oninput = render;
$('#lock').onclick = () => location.reload();
$('#exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([localStorage.vault], {type: 'application/json'}));
  a.download = 'apikeys-vault.json';
  a.click();
};
// 가져오기: 파일 암호로 풀어 이름이나 키가 겹치지 않는 항목만 추가한다 (현재 금고를 덮어쓰지 않는다)
let imp, impAdd;
const ip = $('#ip'), ir = $('#ir');
const sp = (t, c) => Object.assign(document.createElement('span'), {textContent: t, className: c || ''});
$('#imp').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  try {
    imp = JSON.parse(await f.text());
    if (!imp.s || !imp.i || !imp.d) throw 0;
  } catch { return toast('잘못된 파일'); }
  impAdd = null;
  ip.hidden = false;
  ip.value = '';
  ir.textContent = '';
  $('#ig').textContent = '확인';
  $('#ig').disabled = false;
  $('#idg').showModal();
};
$('#if').onsubmit = async e => {
  e.preventDefault();
  if (impAdd) { // 2단계: 미리보기에서 추가 대상으로 나온 항목만 합친다
    items.unshift(...impAdd);
    $('#idg').close();
    render();
    return save();
  }
  let list;
  try {
    const k2 = await derive(ip.value, unb64(imp.s));
    list = JSON.parse(dec.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(imp.i)}, k2, unb64(imp.d))));
    if (!Array.isArray(list)) throw 0;
  } catch { return ir.textContent = '암호 틀림'; }
  const pool = [...items], hit = new Set();
  let skip = 0;
  impAdd = [];
  ir.textContent = '';
  for (const x of list.filter(x => x && typeof x.n === 'string' && typeof x.k === 'string')) {
    const it = {n: x.n.trim(), k: x.k, m: String(x.m ?? '')};
    const {byName, byKey} = match(it.n, it.k, pool);
    if (byName) hit.add(byName);
    const ok = it.n && !byName && !byKey;
    if (ok) { pool.push(it); impAdd.push(it); } else skip++;
    const r = document.createElement('div');
    r.className = 'ir-row' + (byName ? ' same' : '');
    r.append(sp(it.n || '(이름 없음)'), sp(ok ? '추가' : !it.n ? '이름 없음' : byName ? '같은 이름 → 건너뜀' : `같은 키: ${byKey.n} → 건너뜀`));
    ir.append(r);
  }
  ir.prepend(sp(`추가 ${impAdd.length}개 · 건너뜀 ${skip}개`, 'sum'));
  flag(hit);
  ip.hidden = true;
  $('#ig').textContent = `추가 ${impAdd.length}개`;
  $('#ig').disabled = !impAdd.length;
};
$('#ic').onclick = () => $('#idg').close();
// 닫을 때 풀어 둔 내용을 지운다
$('#idg').onclose = () => { imp = impAdd = null; ip.value = ''; ir.textContent = ''; flag(new Set()); };

// 5분 무입력 시 자동 잠금
function idle() { clearTimeout(t2); t2 = setTimeout(() => location.reload(), 300000); }
['input', 'click', 'keydown'].forEach(ev => addEventListener(ev, () => key && idle()));
</script>
