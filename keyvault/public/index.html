<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API 키 금고</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f4f4f5;--line:#d4d4d8;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--card:#1c1c1f;--line:#3f3f46;--ac:#60a5fa}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui}
main{max-width:860px;margin:0 auto;padding:16px}
input,button,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
textarea{resize:none;overflow:hidden;word-break:break-all;display:block;box-sizing:border-box}
[hidden]{display:none!important}
.m{-webkit-text-security:disc}
button{cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
#gate{display:flex;flex-direction:column;gap:8px;max-width:320px;margin:20vh auto}
#bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#q{flex:1;min-width:120px}
.row{display:grid;grid-template-columns:1fr;gap:6px;background:var(--card);padding:8px;border-radius:8px;margin-bottom:8px}
.row .b{display:flex;flex-wrap:wrap;gap:4px}
.row [data-f=k]{font-family:ui-monospace,monospace;font-size:13px}
.row input,.row textarea{min-width:0}
#msg{color:#dc2626;min-height:1.2em}
.info{grid-column:1/-1;font-size:12px;opacity:.75}
.info.w{color:#dc2626;opacity:1}
#st{align-self:center;font-size:12px;opacity:.75}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}</style>
<main>
  <form id="gate">
    <h2 id="gt">잠김</h2>
    <input id="pw" type="password" placeholder="마스터 암호" autocomplete="current-password" autofocus>
    <button class="p">열기</button>
    <div id="msg"></div>
  </form>
  <section id="app" hidden>
    <div id="bar">
      <input id="q" placeholder="검색">
      <button id="add" class="p">+ 추가</button>
      <button id="exp">내보내기</button>
      <button id="imp">가져오기</button>
      <button id="lock">잠금</button>
      <span id="st"></span>
      <input id="file" type="file" accept=".json" hidden>
    </div>
    <div id="list"></div>
  </section>
</main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
// shortcut: spread breaks past ~100KB of data; switch to chunked conversion if the vault grows that large
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let key, salt, items = [], t1, t2;

const derive = async (pw, s) => crypto.subtle.deriveKey(
  {name: 'PBKDF2', salt: s, iterations: 310000, hash: 'SHA-256'},
  await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']),
  {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);

// 저장 후 저장소에서 다시 읽어 복호화해 원본과 비교한다
async function save() {
  const json = JSON.stringify(items);
  try {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, enc.encode(json));
    localStorage.vault = JSON.stringify({s: b64(salt), i: b64(iv), d: b64(ct)});
    const v = JSON.parse(localStorage.vault);
    const back = dec.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(v.i)}, key, unb64(v.d)));
    $('#st').textContent = back === json ? '저장됨 ✓ ' + new Date().toLocaleTimeString() : '저장 실패!';
  } catch { $('#st').textContent = '저장 실패!'; }
}
const saveSoon = () => { $('#st').textContent = '저장 중…'; clearTimeout(t1); t1 = setTimeout(save, 400); };
// textarea는 줄바꿈으로 끝까지 보이고 CSS로 가린다. 미지원 브라우저는 password input으로 대체한다
const TS = CSS.supports('-webkit-text-security', 'disc');
const KEY = TS ? '<textarea rows="1" data-f="k" class="m" placeholder="키" spellcheck="false"></textarea>'
  : '<input data-f="k" type="password" placeholder="키" autocomplete="off" spellcheck="false">';
const masked = el => TS ? el.classList.contains('m') : el.type === 'password';
const mask = (el, on) => TS ? el.classList.toggle('m', on) : (el.type = on ? 'password' : 'text');
const grow = el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; };
const upd = (r, it) => {
  const k = it.k, ws = /\s/.test(k), s = r.querySelector('.info');
  s.className = 'info' + (ws ? ' w' : '');
  s.textContent = (k ? `${k.length}자 · 끝 ${k.slice(-4)}` : '키 비어 있음') + (ws ? ' · ⚠ 공백 포함' : '');
};
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 1200); };

const v0 = () => { try { return JSON.parse(localStorage.vault); } catch { return null; } };
if (!v0()) $('#gt').textContent = '새 금고: 암호 설정 (8자 이상)';

$('#gate').onsubmit = async e => {
  e.preventDefault();
  const pw = $('#pw').value, v = v0();
  $('#msg').textContent = '';
  if (!v) {
    if (pw.length < 8) return $('#msg').textContent = '8자 이상 필요';
    salt = crypto.getRandomValues(new Uint8Array(16));
    key = await derive(pw, salt);
    items = [];
    await save();
  } else {
    salt = unb64(v.s);
    key = await derive(pw, salt);
    try {
      items = JSON.parse(dec.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(v.i)}, key, unb64(v.d))));
    } catch { key = null; return $('#msg').textContent = '암호 틀림'; }
  }
  $('#pw').value = '';
  $('#gate').hidden = true;
  $('#app').hidden = false;
  render();
  idle();
};

function render(focus) {
  const q = $('#q').value.toLowerCase(), list = $('#list');
  list.textContent = '';
  items.forEach((it, i) => {
    if (q && !(it.n + it.m).toLowerCase().includes(q)) return;
    const r = document.createElement('div');
    r.className = 'row';
    r.dataset.i = i;
    r.innerHTML = '<textarea rows="1" data-f="n" placeholder="이름"></textarea>' + KEY + '<input data-f="m" placeholder="메모"><div class="b"><button data-a="eye">보기</button><button data-a="cpn">이름복사</button><button data-a="cpk">키복사</button><button data-a="cpb">둘다복사</button><button data-a="del">삭제</button></div><small class="info"></small>';
    for (const f of ['n', 'k', 'm']) r.querySelector(`[data-f=${f}]`).value = it[f];
    upd(r, it);
    list.append(r);
    r.querySelectorAll('textarea').forEach(grow);
  });
  if (focus) list.querySelector('input')?.focus();
}

$('#list').oninput = e => {
  const f = e.target.dataset.f;
  if (!f) return;
  const row = e.target.closest('.row');
  items[row.dataset.i][f] = e.target.value;
  upd(row, items[row.dataset.i]);
  grow(e.target);
  saveSoon();
};
// 키 칸은 입력 중에만 평문으로 보여 오타를 바로 확인한다
$('#list').addEventListener('focusin', e => { if (e.target.dataset.f === 'k') mask(e.target, false); });
$('#list').addEventListener('focusout', e => { if (e.target.dataset.f === 'k') mask(e.target, true); });
$('#list').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'TEXTAREA') e.preventDefault(); });
addEventListener('resize', () => document.querySelectorAll('#list textarea').forEach(grow));
$('#list').onclick = async e => {
  const a = e.target.dataset.a;
  if (!a) return;
  const row = e.target.closest('.row'), i = row.dataset.i, k = row.querySelector('[data-f=k]');
  if (a === 'eye') { mask(k, !masked(k)); e.target.textContent = masked(k) ? '보기' : '숨김'; }
  const CP = {cpn: it => it.n, cpk: it => it.k, cpb: it => it.n + '=' + it.k};
  if (CP[a]) { await navigator.clipboard.writeText(CP[a](items[i])); toast('복사됨'); }
  if (a === 'del' && confirm('삭제할까요?')) { items.splice(i, 1); await save(); render(); }
};
$('#add').onclick = () => { $('#q').value = ''; items.unshift({n: '', k: '', m: ''}); render(true); saveSoon(); };
$('#q').oninput = () => render();
$('#lock').onclick = () => location.reload();
$('#exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([localStorage.vault], {type: 'application/json'}));
  a.download = 'apikeys-vault.json';
  a.click();
};
$('#imp').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  try {
    const v = JSON.parse(await e.target.files[0].text());
    if (!v.s || !v.i || !v.d) throw 0;
    if (!confirm('현재 금고를 덮어쓸까요?')) return;
    localStorage.vault = JSON.stringify(v);
    location.reload();
  } catch { toast('잘못된 파일'); }
};

// 5분 무입력 시 자동 잠금
function idle() { clearTimeout(t2); t2 = setTimeout(() => location.reload(), 300000); }
['input', 'click', 'keydown'].forEach(ev => addEventListener(ev, () => key && idle()));
</script>
