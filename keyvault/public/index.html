<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>API 키 금고</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f4f4f5;--line:#d4d4d8;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--card:#1c1c1f;--line:#3f3f46;--ac:#60a5fa}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui}
main{max-width:860px;margin:0 auto;padding:16px}
input,button,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
textarea{resize:none;overflow:hidden;word-break:break-all;display:block;box-sizing:border-box}
[hidden]{display:none!important}
.m{-webkit-text-security:disc}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
#gate{display:flex;flex-direction:column;gap:8px;max-width:320px;margin:20vh auto}
#bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#q{flex:1;min-width:120px}
.row{display:flex;gap:6px;align-items:center;background:var(--card);padding:6px 8px;border-radius:8px;margin-bottom:6px}
.hd{cursor:grab;touch-action:none;user-select:none;padding:8px 6px;opacity:.6}
.row.drag{opacity:.6;outline:2px solid var(--ac)}
.row.drop-up{box-shadow:0 -3px 0 var(--ac)}
.row.drop-dn{box-shadow:0 3px 0 var(--ac)}
.row.dupe{background:rgba(220,38,38,.18);box-shadow:inset 4px 0 #dc2626;font-weight:700}
.nm{flex:1;min-width:0;text-align:left;word-break:break-all;background:transparent;border-color:transparent}
#msg{color:#dc2626;min-height:1.2em}
#tmp{margin-bottom:16px;display:grid;gap:6px}
#tt{width:100%;resize:vertical;overflow:auto}
.info{font-size:12px;opacity:.75}
.info.w{color:#dc2626;opacity:1}
#st{align-self:center;font-size:12px;opacity:.75}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:min(560px,calc(100vw - 32px));padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
#f,#if{display:grid;gap:8px}
dialog h3{margin:0}
#f input,#f textarea,#if input{width:100%;box-sizing:border-box}
#ir{max-height:50vh;overflow:auto;display:grid;gap:4px}
.sum{font-weight:600}
.ir-row{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:6px;background:var(--card);word-break:break-all}
.ir-row span:last-child{opacity:.75;white-space:nowrap}
.ir-row.same{background:rgba(220,38,38,.18);border-left:4px solid #dc2626;font-weight:700}
.ir-row.same span:last-child{opacity:1;color:#dc2626}
#dk,#ds{font-family:ui-monospace,monospace;font-size:13px}
.b{display:flex;flex-wrap:wrap;gap:6px}
#dx{margin-left:auto;color:#dc2626}
.b .info{align-self:center}
#dfl{display:grid;gap:4px}
.fr{display:flex;gap:6px;align-items:center;background:var(--card);padding:4px 8px;border-radius:6px}
.fr span{flex:1;min-width:0;word-break:break-all}
.fc{font-size:12px;opacity:.75;white-space:nowrap}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:6px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}</style>
<main>
  <form id="gate">
    <h2 id="gt">잠김</h2>
    <input id="pw" type="password" placeholder="마스터 암호" autocomplete="current-password" autofocus>
    <button class="p">열기</button>
    <div id="msg"></div>
  </form>
  <section id="app" hidden>
    <div id="tmp">
      <textarea id="tt" rows="5" autocomplete="off" placeholder="임시 붙여넣기 (저장되지 않고 잠그거나 새로고침하면 지워짐)" spellcheck="false"></textarea>
      <div class="b"><button id="tc">복사</button><button id="tx">지우기</button></div>
    </div>
    <div id="bar">
      <input id="q" placeholder="검색">
      <button id="add" class="p">+ 추가</button>
      <button id="exp">내보내기</button>
      <button id="imp">가져오기</button>
      <button id="lock">잠금</button>
      <span id="st"></span>
      <input id="file" type="file" accept=".json" hidden>
    </div>
    <div id="list"></div>
  </section>
</main>
<dialog id="dlg">
  <form id="f">
    <h3 id="dt"></h3>
    <textarea id="dn" rows="1" placeholder="이름 (필수)" required></textarea>
    <textarea id="dk" class="m" rows="1" placeholder="KEY (필수)" spellcheck="false" required></textarea>
    <textarea id="ds" class="m" rows="1" placeholder="SECRET (필수)" spellcheck="false" required></textarea>
    <textarea id="dm" rows="2" placeholder="메모"></textarea>
    <div class="b"><button type="button" id="da">파일 추가</button><small class="info">파일당 1MB 전체 2MB까지</small></div>
    <div id="dfl"></div>
    <small id="dfe" class="info w"></small>
    <input type="file" id="df" multiple hidden>
    <small id="di" class="info"></small>
    <div class="b">
      <button class="p">저장</button>
      <button type="button" id="dc">취소</button>
      <button type="button" id="dx">삭제</button>
    </div>
  </form>
</dialog>
<dialog id="idg">
  <form id="if">
    <h3>가져오기</h3>
    <input id="ip" type="password" placeholder="가져올 파일의 마스터 암호" autocomplete="off">
    <div id="ir"></div>
    <div class="b">
      <button id="ig" class="p">확인</button>
      <button type="button" id="ic">취소</button>
    </div>
  </form>
</dialog>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
// 한 번에 펼치는 인자 수 제한을 피하려고 덩어리로 나눠 변환한다 (첨부 파일 때문에 금고가 커질 수 있다)
const b64 = b => {
  const u = new Uint8Array(b);
  let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000));
  return btoa(s);
};
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let key, salt, items = [], ed = -1, t2, exp;

const derive = async (pw, s) => crypto.subtle.deriveKey(
  {name: 'PBKDF2', salt: s, iterations: 310000, hash: 'SHA-256'},
  await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']),
  {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);

// ---- 서버 동기화: 서버에는 암호화된 덩어리만 올라가고 접근 토큰은 마스터 암호에서 따로 만든다 ----
// shortcut: 금고 하나를 통째로 올리고 충돌은 이름 기준 3자 병합으로 푼다. 서버 쪽 시도 횟수 제한은 없어 암호가 약하면 위험하다
const AUTH_SALT = enc.encode('apikeys-vault-auth-v1');
let auth, rv = 0, base = [], busy = Promise.resolve();
async function authTok(pw) {
  const m = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name: 'PBKDF2', salt: AUTH_SALT, iterations: 310000, hash: 'SHA-256'}, m, 256);
  return [...new Uint8Array(bits)].map(x => x.toString(16).padStart(2, '0')).join('');
}
let setup = ''; // 서버 금고를 처음 만들 때만 쓰는 설정 키
const api = (method, body) => fetch('/api/vault', {method, headers: {authorization: 'Bearer ' + auth, 'content-type': 'application/json', ...(setup && {'x-setup': setup})}, body: body && JSON.stringify(body)});
const openWith = async (b, k) => JSON.parse(dec.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(b.i)}, k, unb64(b.d))));
async function tryOpen(b, pw) {
  try { const s = unb64(b.s), k = await derive(pw, s); return {key: k, salt: s, items: await openWith(b, k)}; } catch { return null; }
}
// 서버 금고 | 'none' 서버가 비었음 | 'auth' 암호 불일치 | 'off' 연결 안 됨
async function remote() {
  try {
    const r = await api('GET');
    if (r.status === 404) return 'none';
    if (r.status === 401) return 'auth';
    return r.ok ? await r.json() : 'off';
  } catch { return 'off'; }
}
// 이름이 같은 항목끼리 base 와 비교해 바뀐 쪽을 취한다. 양쪽이 다 바뀌면 local 이 이긴다
function merge3(b, local, rem) {
  const norm = it => it.n.trim().toLowerCase();
  const names = [...local, ...rem].map(norm);
  if (new Set(local.map(norm)).size < local.length || new Set(rem.map(norm)).size < rem.length) {
    const seen = new Set(), out = [];
    for (const it of [...local, ...rem]) { const j = JSON.stringify(it); if (!seen.has(j)) { seen.add(j); out.push(it); } }
    return out;
  }
  const idx = a => new Map(a.map(it => [norm(it), JSON.stringify(it)]));
  const B = idx(b), R = idx(rem), L = idx(local);
  const pick = n => { const l = L.get(n), r = R.get(n), o = B.get(n); return l === r || r === o ? l : l === o ? r : l; };
  return [...new Set(names)].map(pick).filter(Boolean).map(s => JSON.parse(s));
}
const stat = m => { $('#st').textContent = m; };
// 저장 후 저장소에서 다시 읽어 복호화해 원본과 비교하고 서버에도 올린다. 겹치는 저장은 순서대로 처리한다
function save() { const job = busy.then(() => doSave(0)); busy = job.catch(() => {}); return job; }
async function doSave(tries) {
  const json = JSON.stringify(items);
  let blob;
  try {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, enc.encode(json));
    blob = {s: b64(salt), i: b64(iv), d: b64(ct)};
    localStorage.vault = JSON.stringify({...blob, rv, dirty: true});
    const v = JSON.parse(localStorage.vault);
    const back = dec.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(v.i)}, key, unb64(v.d)));
    if (back !== json) return stat('저장 실패!');
  } catch { return stat('저장 실패!'); }
  if (!auth) return stat('저장됨 ✓ ' + new Date().toLocaleTimeString());
  try {
    const r = await api('PUT', {base: rv, blob});
    if (r.status === 401) return stat('저장됨 (서버 암호가 다름)');
    if (r.status === 403) return stat('저장됨 (서버 설정 키가 달라 이 기기에만 저장)');
    if (r.status === 409 && tries < 3) { // 다른 기기에서 먼저 바뀜: 합쳐서 다시 올린다
      const R = await r.json();
      if (R.blob.s !== blob.s) return stat('저장됨 (서버와 금고가 달라 다시 로그인 필요)');
      const rem = await openWith(R.blob, key);
      items = merge3(base, items, rem);
      rv = R.v;
      base = rem;
      render();
      return doSave(tries + 1);
    }
    if (!r.ok) throw 0;
    rv = (await r.json()).v;
    setup = '';
    base = JSON.parse(json);
    localStorage.vault = JSON.stringify({...blob, rv, dirty: false});
    stat('저장됨 ✓ 동기화 ' + new Date().toLocaleTimeString());
  } catch { stat('저장됨 (서버 동기화 안 됨)'); }
}
// 다른 기기에서 바뀐 내용을 가져온다. 이 기기에서 아직 올리지 못한 변경이 있으면 합쳐서 올린다
async function pull() {
  if (!auth || !key || locking || $('#dlg').open || $('#idg').open) return;
  let R;
  try { const r = await api('GET'); if (!r.ok) return; R = await r.json(); } catch { return; }
  const mine = JSON.stringify(items) !== JSON.stringify(base);
  if (R.v === rv) return mine ? save() : undefined;
  if (R.blob.s !== b64(salt)) return lock();
  let rem;
  try { rem = await openWith(R.blob, key); } catch { return; }
  items = merge3(base, items, rem);
  rv = R.v;
  base = rem;
  render();
  if (mine) return save();
  localStorage.vault = JSON.stringify({...R.blob, rv, dirty: false});
  stat('다른 기기의 변경을 받음 ' + new Date().toLocaleTimeString());
}
// 로그인은 2시간 유지된다. 꺼낼 수 없는(non-extractable) 키 객체만 IndexedDB에 두고 암호는 저장하지 않는다
const idb = () => new Promise((res, rej) => {
  const r = indexedDB.open('vault', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('s');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const sget = async () => {
  try {
    const db = await idb();
    return await new Promise(res => { const r = db.transaction('s').objectStore('s').get('k'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
  } catch { return null; }
};
const sset = async v => {
  try {
    const db = await idb();
    await new Promise(res => { const t = db.transaction('s', 'readwrite'); v ? t.objectStore('s').put(v, 'k') : t.objectStore('s').delete('k'); t.oncomplete = res; t.onerror = res; });
  } catch {}
};
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 1200); };

const v0 = () => { try { return JSON.parse(localStorage.vault); } catch { return null; } };
if (!v0()) $('#gt').textContent = '새 금고: 암호 설정 (8자 이상)';

$('#gate').onsubmit = async e => {
  e.preventDefault();
  const pw = $('#pw').value, v = v0();
  $('#msg').textContent = '';
  auth = await authTok(pw);
  let R = await remote(), mism = false;
  if (R === 'auth') { // 서버 금고가 다른 암호로 잠겨 있다: 이 기기의 금고가 열리면 이 기기에서만 쓴다
    if (!v || !(await tryOpen(v, pw))) return $('#msg').textContent = '암호 틀림';
    R = 'off';
    auth = null;
    mism = true;
  }
  const onServer = R && R.blob;
  const srv = onServer ? await tryOpen(R.blob, pw) : null;
  if (onServer && !srv) return $('#msg').textContent = '암호 틀림';
  const loc = v ? await tryOpen(v, pw) : null;
  if (v && !loc && !srv) return $('#msg').textContent = '암호 틀림';
  let st = srv || loc, push = false;
  if (!st) { // 서버에도 이 기기에도 금고가 없다: 새로 만든다
    if (pw.length < 8) return $('#msg').textContent = '8자 이상 필요';
    const s = crypto.getRandomValues(new Uint8Array(16));
    st = {key: await derive(pw, s), salt: s, items: []};
    push = true;
  }
  rv = onServer ? R.v : 0;
  base = srv ? structuredClone(srv.items) : [];
  if (srv && loc && v.dirty) { // 이 기기에서 올리지 못한 변경을 서버 것과 합친다
    st = {...srv, items: merge3(v.rv === R.v ? srv.items : [], loc.items, srv.items)};
    push = true;
  }
  if (!srv && loc && R === 'none') push = true; // 서버가 비었으면 이 기기의 금고를 올려 주인이 된다
  ({key, salt, items} = st);
  if (srv && !push) localStorage.vault = JSON.stringify({...R.blob, rv, dirty: false});
  if (push && R === 'none') setup = prompt('서버 금고를 처음 만들려면 설정 키를 입력하세요. 취소하면 이 기기에만 저장합니다') || '';
  if (push) await save();
  $('#pw').value = '';
  exp = Date.now() + 2 * 3600e3;
  sess = {key, salt: b64(salt), exp, act: Date.now(), auth};
  await sset(sess);
  enter();
  if (mism) stat('서버 금고와 암호가 달라 이 기기에서만 사용 중');
};

// 목록에는 이름만 보인다. 이름을 누르면 이름 복사 키는 옆 버튼으로만 복사한다
function render() {
  const q = $('#q').value.toLowerCase(), list = $('#list');
  list.textContent = '';
  items.forEach((it, i) => {
    if (q && !(it.n + it.m).toLowerCase().includes(q)) return;
    const r = document.createElement('div');
    r.className = 'row';
    r.dataset.i = i;
    // 검색 중에는 보이는 항목 사이 순서가 모호해서 끌기 핸들을 숨긴다
    r.innerHTML = (q ? '' : '<span class="hd" title="끌어서 이동" aria-label="끌어서 이동">☰</span>')
      + '<button class="nm" data-a="cpn"></button><button data-a="cpk">KEY복사</button><button data-a="cps">SECRET복사</button><button data-a="ed">수정</button>';
    r.querySelector('.nm').textContent = it.n;
    r.querySelector('.nm').title = it.m;
    r.querySelector('[data-a=cps]').disabled = !it.sc;
    if (it.f?.length) r.querySelector('.nm').after(sp(`📎 ${it.f.length}`, 'fc'));
    list.append(r);
  });
}

$('#list').onclick = async e => {
  const b = e.target.closest('button');
  if (!b) return;
  const i = +b.closest('.row').dataset.i, a = b.dataset.a;
  if (a === 'ed') return openDlg(i);
  try {
    await navigator.clipboard.writeText({cpn: items[i].n, cpk: items[i].k, cps: items[i].sc}[a]);
    toast({cpn: '이름', cpk: 'KEY', cps: 'SECRET'}[a] + ' 복사됨');
  } catch { toast('복사 실패'); }
};

// 드래그로 순서 바꾸기: 포인터 이벤트라 마우스와 터치가 같이 된다. 핸들을 잡고 끌어 놓은 자리로 옮긴다
// shortcut: 화면 가장자리 자동 스크롤은 포인터가 움직일 때만 한 번씩 일어난다. 긴 목록에서 불편하면 타이머로 바꾼다
let drag;
const dragEnd = () => {
  document.querySelectorAll('#list .row').forEach(r => r.classList.remove('drag', 'drop-up', 'drop-dn'));
  drag = null;
};
$('#list').addEventListener('pointerdown', e => {
  const h = e.target.closest('.hd');
  if (!h) return;
  const row = h.closest('.row'), i = +row.dataset.i;
  drag = {from: i, to: i};
  row.classList.add('drag');
  h.setPointerCapture(e.pointerId);
  e.preventDefault();
});
$('#list').addEventListener('pointermove', e => {
  if (!drag) return;
  const rows = [...document.querySelectorAll('#list .row')];
  const hit = rows.find(r => { const b = r.getBoundingClientRect(); return e.clientY >= b.top && e.clientY <= b.bottom; })
    || (e.clientY < rows[0].getBoundingClientRect().top ? rows[0] : rows.at(-1));
  drag.to = +hit.dataset.i;
  rows.forEach(r => r.classList.toggle('drop-up', r === hit && drag.to < drag.from));
  rows.forEach(r => r.classList.toggle('drop-dn', r === hit && drag.to > drag.from));
  if (e.clientY < 50) scrollBy(0, -12); else if (e.clientY > innerHeight - 50) scrollBy(0, 12);
});
$('#list').addEventListener('pointerup', () => {
  if (!drag) return;
  const {from, to} = drag;
  dragEnd();
  if (from === to) return;
  items.splice(to, 0, ...items.splice(from, 1));
  render();
  save();
});
$('#list').addEventListener('pointercancel', dragEnd);

// 키 칸은 textarea에 CSS로 가려 줄바꿈으로 끝까지 보이게 한다. 미지원 브라우저는 password input으로 대체한다
const TS = CSS.supports('-webkit-text-security', 'disc');
if (!TS) for (const [id, ph] of [['dk', 'KEY (필수)'], ['ds', 'SECRET (필수)']]) {
  $('#' + id).replaceWith(Object.assign(document.createElement('input'),
    {id, type: 'password', autocomplete: 'off', spellcheck: false, placeholder: ph, required: true}));
}
const dn = $('#dn'), dk = $('#dk'), ds = $('#ds'), dm = $('#dm');
const grow = el => { if (el.tagName === 'TEXTAREA') { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; } };
const mask = (el, on) => TS ? el.classList.toggle('m', on) : (el.type = on ? 'password' : 'text');
// 다른 항목과 이름이나 키가 같으면 이유를 돌려준다 (공백 차이는 무시하고 이름은 대소문자도 무시)
const match = (n, k, others) => ({
  byName: n.trim() && others.find(o => o.n.trim().toLowerCase() === n.trim().toLowerCase()),
  byKey: k.trim() && others.find(o => o.k.trim() === k.trim()),
});
const dupOf = () => {
  const {byName, byKey} = match(dn.value, dk.value, items.filter((_, i) => i !== ed));
  return {byName, msg: [byName && '같은 이름 있음', byKey && `같은 키 있음: ${byKey.n}`].filter(Boolean).join(' · ')};
};
// 같은 이름이 이미 있는 항목을 목록에서 강조하고 화면 안으로 가져온다
const flag = set => {
  document.querySelectorAll('#list .row').forEach(r => r.classList.toggle('dupe', set.has(items[r.dataset.i])));
  $('#list .dupe')?.scrollIntoView({block: 'center'});
};
function info() {
  const k = dk.value, ws = /\s/.test(k + ds.value), d = dupOf(), s = $('#di');
  s.className = 'info' + (ws || d.msg ? ' w' : '');
  s.textContent = (k ? `KEY ${k.length}자 · 끝 ${k.slice(-4)}` : 'KEY 비어 있음') + (ds.value ? ` · SECRET ${ds.value.length}자` : ' · SECRET 비어 있음') + (ws ? ' · ⚠ 공백 포함' : '') + (d.msg ? ` · ⛔ ${d.msg}` : '');
  $('#f .p').disabled = !!d.msg;
  flag(new Set(d.byName ? [d.byName] : []));
}
// 첨부 파일: 항목과 함께 금고 안에서 암호화되어 저장된다. localStorage 용량 때문에 크기를 제한한다
const FILE_MAX = 1024 * 1024, TOTAL_MAX = 2 * 1024 * 1024;
let dfs = [];
const fsize = fs => (fs || []).reduce((a, f) => a + f.s, 0);
const kb = n => (n / 1024).toFixed(n < 10240 ? 1 : 0) + 'KB';
const cleanF = f => Array.isArray(f)
  ? f.filter(x => x && typeof x.n === 'string' && typeof x.d === 'string' && Number.isFinite(x.s)).map(x => ({n: x.n, t: String(x.t ?? ''), s: x.s, d: x.d}))
  : [];
function renderFiles() {
  const box = $('#dfl');
  box.textContent = '';
  dfs.forEach((f, i) => {
    const r = document.createElement('div');
    r.className = 'fr';
    r.dataset.i = i;
    r.append(sp(`${f.n} (${kb(f.s)})`));
    for (const [a, t] of [['dl', '받기'], ['rm', '삭제']]) {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.a = a;
      b.textContent = t;
      r.append(b);
    }
    box.append(r);
  });
}
$('#dfl').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  const i = +b.closest('.fr').dataset.i, f = dfs[i];
  if (b.dataset.a === 'rm') { dfs.splice(i, 1); return renderFiles(); }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([unb64(f.d)], {type: 'application/octet-stream'}));
  a.download = f.n;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#da').onclick = () => $('#df').click();
$('#df').onchange = async e => {
  const used = items.reduce((a, it, i) => a + (i === ed ? 0 : fsize(it.f)), 0), err = $('#dfe');
  err.textContent = '';
  for (const file of e.target.files) {
    if (file.size > FILE_MAX) { err.textContent = `${file.name}: 1MB 초과`; continue; }
    if (used + fsize(dfs) + file.size > TOTAL_MAX) { err.textContent = '전체 2MB 초과'; break; }
    dfs.push({n: file.name, t: file.type, s: file.size, d: b64(await file.arrayBuffer())});
  }
  e.target.value = '';
  renderFiles();
};
function openDlg(i) {
  ed = i;
  const it = i < 0 ? {n: '', k: '', m: ''} : items[i];
  dn.value = it.n; dk.value = it.k; ds.value = it.sc ?? ''; dm.value = it.m;
  dfs = cleanF(it.f);
  $('#dfe').textContent = '';
  renderFiles();
  $('#dt').textContent = i < 0 ? '키 추가' : '키 수정';
  $('#dx').hidden = i < 0;
  mask(dk, true);
  mask(ds, true);
  $('#dlg').showModal();
  [dn, dk, ds, dm].forEach(grow);
  info();
}
// 키 칸은 입력 중에만 평문으로 보여 오타를 바로 확인한다
for (const el of [dk, ds]) { el.onfocus = () => mask(el, false); el.onblur = () => mask(el, true); }
$('#f').oninput = e => { if (e.target.tagName === 'TEXTAREA') grow(e.target); info(); };
$('#f').onkeydown = e => { if (e.key === 'Enter' && e.target.tagName === 'TEXTAREA' && e.target !== dm) { e.preventDefault(); $('#f').requestSubmit(); } };
$('#f').onsubmit = async e => {
  e.preventDefault();
  if (dupOf().msg) return dk.focus();
  const it = {n: dn.value.trim(), k: dk.value, sc: ds.value, m: dm.value, f: dfs};
  if (!it.n || !it.k.trim() || !it.sc.trim()) return (it.n ? it.k.trim() ? ds : dk : dn).focus();
  if (!it.n) return dn.focus();
  if (ed < 0) items.unshift(it); else items[ed] = it;
  $('#dlg').close();
  render();
  await save();
};
$('#dc').onclick = () => $('#dlg').close();
$('#dx').onclick = async () => {
  if (!confirm('삭제할까요?')) return;
  items.splice(ed, 1);
  $('#dlg').close();
  render();
  await save();
};
// 닫을 때 입력값을 지워 키가 화면 밖 DOM에 남지 않게 한다
$('#dlg').onclose = () => { dn.value = dk.value = ds.value = dm.value = ''; dfs = []; renderFiles(); flag(new Set()); };
addEventListener('resize', () => [dn, dk, ds, dm].forEach(grow));

$('#add').onclick = () => openDlg(-1);
// 임시 붙여넣기 칸은 메모리에만 있다. 저장하지 않으므로 잠그거나 새로고침하면 사라진다
$('#tc').onclick = async () => {
  try { await navigator.clipboard.writeText($('#tt').value); toast('복사됨'); } catch { toast('복사 실패'); }
};
$('#tx').onclick = () => { $('#tt').value = ''; $('#tt').focus(); };
// 새로고침이나 뒤로가기 캐시에서 브라우저가 입력값을 되살리지 못하게 떠날 때 비운다
addEventListener('pagehide', () => { $('#tt').value = ''; });
$('#q').oninput = render;
$('#lock').onclick = () => lock();
$('#exp').onclick = () => {
  const a = document.createElement('a');
  const {s, i, d} = v0();
  a.href = URL.createObjectURL(new Blob([JSON.stringify({s, i, d})], {type: 'application/json'}));
  a.download = 'apikeys-vault.json';
  a.click();
};
// 가져오기: 파일 암호로 풀어 이름이나 키가 겹치지 않는 항목만 추가한다 (현재 금고를 덮어쓰지 않는다)
let imp, impAdd;
const ip = $('#ip'), ir = $('#ir');
const sp = (t, c) => Object.assign(document.createElement('span'), {textContent: t, className: c || ''});
$('#imp').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  try {
    imp = JSON.parse(await f.text());
    if (!imp.s || !imp.i || !imp.d) throw 0;
  } catch { return toast('잘못된 파일'); }
  impAdd = null;
  ip.hidden = false;
  ip.value = '';
  ir.textContent = '';
  $('#ig').textContent = '확인';
  $('#ig').disabled = false;
  $('#idg').showModal();
};
$('#if').onsubmit = async e => {
  e.preventDefault();
  if (impAdd) { // 2단계: 미리보기에서 추가 대상으로 나온 항목만 합친다
    items.unshift(...impAdd);
    $('#idg').close();
    render();
    return save();
  }
  let list;
  try {
    const k2 = await derive(ip.value, unb64(imp.s));
    list = JSON.parse(dec.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(imp.i)}, k2, unb64(imp.d))));
    if (!Array.isArray(list)) throw 0;
  } catch { return ir.textContent = '암호 틀림'; }
  const pool = [...items], hit = new Set();
  let skip = 0;
  impAdd = [];
  ir.textContent = '';
  for (const x of list.filter(x => x && typeof x.n === 'string' && typeof x.k === 'string')) {
    const it = {n: x.n.trim(), k: x.k, sc: String(x.sc ?? ''), m: String(x.m ?? ''), f: cleanF(x.f)};
    const {byName, byKey} = match(it.n, it.k, pool);
    if (byName) hit.add(byName);
    const ok = it.n && !byName && !byKey;
    if (ok) { pool.push(it); impAdd.push(it); } else skip++;
    const r = document.createElement('div');
    r.className = 'ir-row' + (byName ? ' same' : '');
    r.append(sp(it.n || '(이름 없음)'), sp(ok ? '추가' : !it.n ? '이름 없음' : byName ? '같은 이름 → 건너뜀' : `같은 키: ${byKey.n} → 건너뜀`));
    ir.append(r);
  }
  ir.prepend(sp(`추가 ${impAdd.length}개 · 건너뜀 ${skip}개`, 'sum'));
  flag(hit);
  ip.hidden = true;
  $('#ig').textContent = `추가 ${impAdd.length}개`;
  $('#ig').disabled = !impAdd.length;
};
$('#ic').onclick = () => $('#idg').close();
// 닫을 때 풀어 둔 내용을 지운다
$('#idg').onclose = () => { imp = impAdd = null; ip.value = ''; ir.textContent = ''; flag(new Set()); };

// 만료되거나 잠금을 누르면 저장된 세션 키를 지우고 다시 잠근다
let locking;
async function lock() {
  if (locking) return;
  locking = true;
  key = sess = null;
  $('#tt').value = '';
  clearTimeout(t2);
  clearTimeout(t3);
  await sset(null);
  location.reload();
}
// 세션 기록이 아직 있을 때만 갱신한다. 다른 탭에서 잠갔다면 false를 돌려줘 이 탭도 잠그게 한다
const supd = async v => {
  try {
    const db = await idb();
    let ok = false;
    await new Promise(res => {
      const t = db.transaction('s', 'readwrite'), st = t.objectStore('s');
      st.get('k').onsuccess = e => { if (e.target.result) { ok = true; st.put(v, 'k'); } };
      t.oncomplete = res;
      t.onerror = res;
    });
    return ok;
  } catch { return true; }
};
function enter() {
  $('#gate').hidden = true;
  $('#app').hidden = false;
  render();
  clearTimeout(t2);
  t2 = setTimeout(lock, Math.max(0, exp - Date.now()));
  touch();
}
// 무입력 30분이면 2시간 안이어도 잠근다. 마지막 활동 시각을 세션에 적어 두어 탭을 닫았다 열어도 적용된다
const IDLE = 30 * 60e3;
let sess, t3, lastW = 0;
function touch() {
  if (!key || locking) return;
  const n = Date.now();
  sess.act = n;
  clearTimeout(t3);
  t3 = setTimeout(lock, IDLE);
  if (n - lastW > 30e3) { lastW = n; supd(sess).then(ok => { if (!ok) lock(); }); }
}
['input', 'click', 'keydown'].forEach(ev => addEventListener(ev, touch));
// 절전 등으로 타이머가 밀렸을 수 있어 탭이 다시 보일 때도 확인한다
addEventListener('visibilitychange', () => {
  if (key && (Date.now() > exp || Date.now() - sess.act > IDLE)) lock();
  else if (!document.hidden) pull();
});
setInterval(() => { if (!document.hidden) pull(); }, 60000);

// 페이지를 열 때 아직 만료 전이고 금고가 그대로면 암호 없이 복원한다
(async () => {
  try {
    const s = await sget(), v = v0();
    if (!s || !v || !s.auth || s.exp < Date.now() || Date.now() - s.act > IDLE || s.salt !== v.s) return sset(null);
    sess = s;
    auth = s.auth;
    rv = v.rv || 0;
    key = s.key;
    salt = unb64(v.s);
    exp = s.exp;
    items = JSON.parse(dec.decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: unb64(v.i)}, key, unb64(v.d))));
    base = v.dirty ? [] : structuredClone(items);
    enter();
    pull();
  } catch { key = null; sset(null); }
})();
</script>
