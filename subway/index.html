<title>수도권 지하철 노선도</title>
<style>

:root{--bg:#EDF0EE;--river:#BCD6E4;--fg:#1C2428;--muted:#5E6B70;--panel:#FFFFFF;--edge:#CBD3D6;--accent:#0052A4;--sans:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171A;--river:#1D3340;--fg:#E6ECEE;--muted:#93A2A8;--panel:#1B2226;--edge:#2D3A40;--accent:#6AA9F0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171A;--river:#1D3340;--fg:#E6ECEE;--muted:#93A2A8;--panel:#1B2226;--edge:#2D3A40;--accent:#6AA9F0;color-scheme:dark}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);position:relative}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;display:block}
#map:active{cursor:grabbing}
.ln{fill:none;stroke-width:4.5px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:opacity .15s}
.river{fill:none;stroke:var(--river);stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.st circle.n{r:calc(2.6px*var(--u));fill:var(--bg);stroke-width:calc(1.6px*var(--u))}
.st circle.t{r:calc(4.8px*var(--u));fill:var(--panel);stroke:var(--fg);stroke-width:calc(1.8px*var(--u))}
.st circle.h{r:calc(10px*var(--u));fill:transparent;stroke:none;cursor:pointer}
.st text{font-size:calc(11px*var(--u));fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:calc(3px*var(--u));stroke-linejoin:round;pointer-events:none;display:none}
svg.l-all .st text,svg.l-tr .st.tr text,.st.sel text{display:block}
.st.sel circle.n,.st.sel circle.t{stroke:var(--accent);stroke-width:calc(2.6px*var(--u))}
.train{r:calc(3.8px*var(--u));fill:var(--panel);stroke-width:calc(2px*var(--u));pointer-events:none;filter:drop-shadow(0 0 calc(3px*var(--u)) rgb(255 255 255/.7))}
svg.iso .ln:not(.on),svg.iso .train:not(.on){opacity:.1}
svg.iso .st.off{opacity:.15}
.panel{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:16px;width:min(340px,calc(100% - 32px));background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 12px rgb(0 0 0/.12)}
h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.01em}
#q{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--edge);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
#q:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lg{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;border:1px solid var(--edge);background:var(--bg);color:var(--fg);font:inherit;font-size:12px;cursor:pointer}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.chip[aria-pressed="true"]{border-color:var(--fg);font-weight:700}
#info{font-size:13px;color:var(--muted);min-height:1.4em;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#info b{color:var(--fg);font-size:14px;margin-right:2px}
.zoom{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid var(--edge);background:var(--panel);color:var(--fg);font:inherit;font-size:18px;cursor:pointer}
.note{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:16px;font-size:11px;color:var(--muted);max-width:60%}
@media (prefers-reduced-motion:reduce){.ln{transition:none}}
</style>

// 한강 (위도:경도)
const RIVER="37.598:126.813 37.582:126.828 37.570:126.856 37.555:126.897 37.5435:126.907 37.530:126.930 37.519:126.959 37.507:126.987 37.512:127.005 37.536:127.036 37.529:127.057 37.523:127.090 37.540:127.128 37.553:127.170";
const X=o=>(o-126.4)*3174,Y=a=>(37.75-a)*4000;
const P=new Map(),M=new Map();
const NS="http://www.w3.org/2000/svg";
LINES.forEach(l=>{l.paths=l.p.map(s=>s.split(/\s+/).map(t=>{const[n,a,o]=t.split(":");if(a&&!P.has(n))P.set(n,[X(+o),Y(+a)]);return n}));
 l.paths.forEach(p=>p.forEach(n=>{if(!M.has(n))M.set(n,new Set());M.get(n).add(l.id)}))});
const miss=[...M.keys()].filter(n=>!P.has(n));if(miss.length)console.warn("좌표 없음",miss);
const svg=document.getElementById("map");
const pts=a=>a.map(n=>P.get(n)).filter(Boolean).map(q=>q.join(",")).join(" ");
const riverPts=RIVER.split(" ").map(s=>{const[a,o]=s.split(":");return X(+o)+","+Y(+a)}).join(" ");
let h=`<polyline class="river" points="${riverPts}"/>`;
LINES.forEach(l=>l.paths.forEach(p=>{h+=`<polyline class="ln" data-l="${l.id}" stroke="${l.c}" points="${pts(p)}"/>`}));
h+=`<g id="gt"></g>`;
const col=Object.fromEntries(LINES.map(l=>[l.id,l.c]));
[...M.keys()].filter(n=>P.has(n)).forEach(n=>{const[x,y]=P.get(n),ls=[...M.get(n)],t=ls.length>1;
 h+=`<g class="st${t?" tr":""}" data-n="${n}" data-ls="${ls.join("")}"><circle class="${t?"t":"n"}" cx="${x}" cy="${y}" ${t?"":`stroke="${col[ls[0]]}"`}/><circle class="h" cx="${x}" cy="${y}"/><text x="${x}" y="${y}" dx="calc(1px)" >${n}</text></g>`});
svg.innerHTML=h;
// 열차 점: 각 경로를 왕복하며 움직인다
const gt=svg.querySelector("#gt"),TR=[],SPEED=150;
LINES.forEach(l=>l.paths.forEach(p=>{const q=p.map(n=>P.get(n)).filter(Boolean),c=[0];
 for(let i=1;i<q.length;i++)c.push(c[i-1]+Math.hypot(q[i][0]-q[i-1][0],q[i][1]-q[i-1][1]));
 const L=c[c.length-1];if(L<50)return;const n=Math.max(1,Math.round(L/450));
 for(let k=0;k<n;k++){const e=document.createElementNS(NS,"circle");e.setAttribute("class","train");e.setAttribute("stroke",l.c);e.dataset.l=l.id;gt.appendChild(e);TR.push({e,q,c,L,ph:(k+Math.random()*.6)/n*2*L})}}));
function place(T,d){let s=d%(2*T.L);if(s>T.L)s=2*T.L-s;let i=1;while(i<T.c.length-1&&T.c[i]<s)i++;
 const f=(s-T.c[i-1])/((T.c[i]-T.c[i-1])||1),a=T.q[i-1],b=T.q[i];
 T.e.setAttribute("cx",a[0]+(b[0]-a[0])*f);T.e.setAttribute("cy",a[1]+(b[1]-a[1])*f)}
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function tick(ms){TR.forEach(T=>place(T,T.ph+ms/1000*SPEED));if(!still)requestAnimationFrame(tick)}
requestAnimationFrame(tick);
// 라벨 오프셋은 줌에 따라 달라지므로 text 위치를 JS로 갱신한다
const texts=[...svg.querySelectorAll(".st text")];
let v={x:0,y:0,w:1200};
function apply(){const r=svg.getBoundingClientRect(),hh=v.w*r.height/r.width,u=v.w/r.width;
 svg.setAttribute("viewBox",`${v.x} ${v.y} ${v.w} ${hh}`);svg.style.setProperty("--u",u);
 svg.classList.toggle("l-all",u<0.45);svg.classList.toggle("l-tr",u>=0.45&&u<1.7);
 texts.forEach(t=>{t.setAttribute("dx",(7*u).toFixed(2));t.setAttribute("dy",(4*u).toFixed(2))})}
function fit(){const r=svg.getBoundingClientRect(),w=1250,hh=1250;
 v.w=Math.max(w,hh*r.width/r.height);v.x=1240-(v.w-w)/2;v.y=130;apply()}
function zoomAt(cx,cy,f){const r=svg.getBoundingClientRect(),u=v.w/r.width,px=v.x+cx*u,py=v.y+cy*u;
 const nw=Math.min(4000,Math.max(60,v.w*f)),nu=nw/r.width;v.x=px-cx*nu;v.y=py-cy*nu;v.w=nw;apply()}
function center(n){const q=P.get(n);if(!q)return;const r=svg.getBoundingClientRect();v.w=r.width*0.35;
 const u=v.w/r.width;v.x=q[0]-r.width*u/2;v.y=q[1]-r.height*u/2;apply()}
const ptr=new Map();let moved=0,pd=0;
svg.addEventListener("pointerdown",e=>{svg.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;pd=ptr.size==2?Math.hypot(...[...ptr.values()].reduce((a,b)=>[a[0]-b[0],a[1]-b[1]])):0});
svg.addEventListener("pointermove",e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId),r=svg.getBoundingClientRect(),u=v.w/r.width;
 if(ptr.size==1){v.x-=(e.clientX-o[0])*u;v.y-=(e.clientY-o[1])*u;moved+=Math.abs(e.clientX-o[0])+Math.abs(e.clientY-o[1]);ptr.set(e.pointerId,[e.clientX,e.clientY]);apply()}
 else{ptr.set(e.pointerId,[e.clientX,e.clientY]);const a=[...ptr.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
  if(pd){zoomAt((a[0][0]+a[1][0])/2-r.left,(a[0][1]+a[1][1])/2-r.top,pd/d);moved=9}pd=d}});
const up=e=>{ptr.delete(e.pointerId);pd=0};svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
svg.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(e.deltaY*0.0015))},{passive:false});
svg.addEventListener("click",e=>{if(moved>5)return;const g=e.target.closest(".st");if(g)pick(g.dataset.n)});
const info=document.getElementById("info");let sel=null;
function pick(n){svg.querySelectorAll(".st.sel").forEach(g=>g.classList.remove("sel"));
 const g=svg.querySelector(`.st[data-n="${n}"]`);if(!g)return;g.classList.add("sel");g.parentNode.appendChild(g);sel=n;
 info.innerHTML=`<b></b>`+[...M.get(n)].map(i=>{const l=LINES.find(x=>x.id==i);return `<span class="chip"><i style="background:${l.c}"></i>${l.name}</span>`}).join("");
 info.firstChild.textContent=n}
const lg=document.getElementById("lg");let iso=null;
LINES.forEach(l=>{const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed","false");b.innerHTML=`<i style="background:${l.c}"></i>${l.name}`;
 b.onclick=()=>{iso=iso==l.id?null:l.id;svg.classList.toggle("iso",!!iso);
  svg.querySelectorAll(".ln,.train").forEach(e=>e.classList.toggle("on",e.dataset.l==iso));
  svg.querySelectorAll(".st").forEach(g=>g.classList.toggle("off",!!iso&&!g.dataset.ls.includes(iso)));
  lg.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b&&!!iso)))};lg.appendChild(b)});
document.getElementById("names").innerHTML=[...M.keys()].sort().map(n=>`<option value="${n}">`).join("");
const q=document.getElementById("q");q.addEventListener("change",()=>{const n=q.value.trim();if(P.has(n)){pick(n);center(n)}});
document.getElementById("zi").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,0.6)};
document.getElementById("zo").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.width/2,r.height/2,1.6)};
document.getElementById("zf").onclick=fit;
addEventListener("resize",apply);fit();
</script>
