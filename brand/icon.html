<!doctype html>
<!-- sell.usb 프로필 아이콘 시안. render.mjs 가 ?v=c..f 로 열어 1080 PNG 로 찍는다. -->
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:Poppins;src:url(Poppins-Black.ttf);font-weight:900}
  html,body{margin:0;width:1080px;height:1080px;overflow:hidden}
  svg{display:block}
  text{font-family:Poppins,sans-serif;font-weight:900;letter-spacing:-4px}
</style></head><body>
<svg id="c" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- C: 분홍 바탕 + 똑바른 흰 가격표 + 두 줄 글자 -->
  <defs><linearGradient id="gp" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E1306C"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity=".25"/></filter></defs>
  <rect width="1080" height="1080" fill="url(#gp)"/>
  <g transform="translate(540 540) scale(1.15) translate(-540 -540)">
  <g filter="url(#sh)">
    <path d="M300 300 H780 a40 40 0 0 1 40 40 V740 a40 40 0 0 1 -40 40 H300 a40 40 0 0 1 -40 -40 V340 a40 40 0 0 1 40 -40Z" fill="#fff"/>
  </g>
  <circle cx="540" cy="360" r="24" fill="#E1306C"/>
  <text x="540" y="580" font-size="200" text-anchor="middle" fill="#14141E">sell</text>
  <text x="540" y="730" font-size="150" text-anchor="middle" fill="#E4002B">.usb</text>
  <path d="M780 290 l14 40 40 14 -40 14 -14 40 -14 -40 -40 -14 40 -14Z" fill="#FFD54A"/>
  </g>
</svg>

<svg id="d" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- D: 노란 바탕 + 빨간 쇼핑백 -->
  <rect width="1080" height="1080" fill="#FFD54A"/>
  <g transform="translate(540 540) scale(1.15) translate(-540 -540)">
  <path d="M430 360 v-40 a110 110 0 0 1 220 0 v40" fill="none" stroke="#14141E" stroke-width="34" stroke-linecap="round"/>
  <path d="M290 340 H790 L760 800 a30 30 0 0 1 -30 28 H350 a30 30 0 0 1 -30 -28Z" fill="#E4002B"/>
  <circle cx="430" cy="400" r="18" fill="#14141E"/><circle cx="650" cy="400" r="18" fill="#14141E"/>
  <text x="540" y="620" font-size="180" text-anchor="middle" fill="#fff">sell</text>
  <text x="540" y="770" font-size="140" text-anchor="middle" fill="#FFD54A">.usb</text>
  </g>
</svg>

<svg id="e" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- E: 어두운 바탕 + 노란 가격표 + 구멍 자리에 재생 버튼 (쇼츠 릴스) -->
  <rect width="1080" height="1080" fill="#16162A"/>
  <g transform="translate(540 540) scale(1.12) translate(-540 -540)">
  <path d="M370 300 H800 a40 40 0 0 1 40 40 V740 a40 40 0 0 1 -40 40 H370 L240 540Z" fill="#FFD54A" stroke-linejoin="round"/>
  <circle cx="370" cy="540" r="62" fill="#E1306C"/>
  <path d="M352 508 L402 540 L352 572Z" fill="#fff"/>
  <text x="635" y="530" font-size="150" text-anchor="middle" fill="#14141E">sell</text>
  <text x="635" y="680" font-size="120" text-anchor="middle" fill="#E4002B">.usb</text>
  </g>
</svg>

<svg id="f" width="1080" height="1080" viewBox="0 0 1080 1080">
  <!-- F: 분홍 바탕 + 노란 세일 스티커(별 모양) + 빨간 원 -->
  <rect width="1080" height="1080" fill="#E1306C"/>
  <polygon id="burst" fill="#FFD54A"/>
  <circle cx="540" cy="540" r="330" fill="#E4002B"/>
  <text x="540" y="545" font-size="190" text-anchor="middle" fill="#fff">sell</text>
  <text x="540" y="700" font-size="145" text-anchor="middle" fill="#FFD54A">.usb</text>
</svg>
<script>
  // 세일 스티커 톱니: 24갈래 별 (반지름 420 / 360)
  const p=[];for(let i=0;i<48;i++){const a=Math.PI*i/24,r=i%2?360:420;p.push((540+r*Math.cos(a)).toFixed(1)+','+(540+r*Math.sin(a)).toFixed(1))}
  document.getElementById('burst').setAttribute('points',p.join(' '));
  const v=new URLSearchParams(location.search).get('v')||'c';
  document.querySelectorAll('body>svg').forEach(s=>s.style.display=s.id===v?'block':'none');
</script>
</body></html>
